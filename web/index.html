<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>psradio</title>
  <link rel="stylesheet" href="css/radio.css">
  <link rel="stylesheet" href="css/models.css">
</head>
<body>
  <!-- data-skin and data-keys come from the player's radio model -->
  <section id="radio" class="radio" data-skin="handheld" data-keys="3" hidden
           aria-label="Radio" data-i18n-aria="ui_radio">
    <div class="antenna" aria-hidden="true"></div>

    <div class="top">
      <button id="btn-power" class="btn-round" type="button" aria-pressed="false" data-i18n-aria="ui_power">
        <span aria-hidden="true">&#9211;</span>
      </button>
      <span id="led" class="led" aria-hidden="true"></span>
      <span id="batt" class="batt" hidden role="status" data-i18n-aria="ui_battery">
        <span class="batt-shell" aria-hidden="true"><span id="batt-bar" class="batt-bar"></span></span>
        <span id="batt-text" class="batt-text"></span>
      </span>
      <button id="btn-close" class="btn-small" type="button" data-i18n-aria="ui_close">&times;</button>
    </div>

    <div id="lcd" class="lcd off">
      <div class="lcd-status">
        <span id="lcd-mode"></span>
        <span id="lcd-ind"></span>
        <span id="lcd-unit"></span>
      </div>

      <!-- the normal channel display -->
      <div id="lcd-main" class="lcd-main">
        <div id="lcd-zone" class="lcd-zone"></div>
        <div id="lcd-chan" class="lcd-chan"></div>
      </div>

      <!-- menu pages draw here instead (settings, info) -->
      <div id="lcd-panel" class="lcd-panel" hidden></div>

      <div id="lcd-msg" class="lcd-msg" role="status" aria-live="polite"></div>
      <div id="lcd-soft" class="lcd-soft" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div id="softkeys" class="softkeys">
      <button class="btn-soft" type="button" data-soft="0"></button>
      <button class="btn-soft" type="button" data-soft="1"></button>
      <button class="btn-soft" type="button" data-soft="2"></button>
      <button class="btn-soft" type="button" data-soft="3"></button>
    </div>

    <div class="knobs">
      <button id="btn-vol-down" class="btn-small" type="button" data-i18n-aria="ui_vol_down">&minus;</button>
      <button id="btn-vol-up" class="btn-small" type="button" data-i18n-aria="ui_vol_up">+</button>
      <button id="btn-menu" class="btn-small btn-menu" type="button" data-i18n-aria="ui_menu"></button>
    </div>

    <button id="btn-ptt" class="btn-ptt" type="button" data-i18n="ui_ptt"></button>
  </section>

  <script src="js/audio/codecs.js"></script>
  <script src="js/audio/capture.js"></script>
  <script src="js/audio/playback.js"></script>
  <script src="js/audio/tones.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
